<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph of Text -->
    <p>This is a simple paragraph of text. HTML stands for HyperText Markup Language and is used to structure content on the web.</p>

    <!-- Subheading -->
    <h2>Useful Resources</h2>

    <!-- Unordered List with Links -->
    <ul>
        <li>Visit the official <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a> for documentation.</li>
        <li>Learn web development tutorials on <a href="https://www.w3schools.com" target="_blank">W3Schools</a>.</li>
    </ul>

    <!-- Image Example -->
    <h2>Image Gallery</h2>
    <img src="https://placeholder.com" alt="A descriptive placeholder image" width="300" height="200">

</body>
</html>
